name: Deploy

# Gate on tests, build + push the web and worker images to ECR (immutable
# :${sha} tags only), run DB migrations as a release step, then register new
# SHA-pinned task-def revisions and roll the two ECS Fargate services.
#
# ─────────────────────────────────────────────────────────────────────────────
# REQUIRES AWS SETUP (provisioned by the CDK app in ./infra):
#   • An IAM role assumable via GitHub OIDC (see infra GitHubDeployRoleArn),
#     set as the `AWS_DEPLOY_ROLE_ARN` repo secret.
#   • Two ECR repositories: `marketplace-web` and `marketplace-worker`.
#   • An ECS cluster with services `web` and `worker` (names from CDK outputs).
#   • A one-off "migrate" task definition that runs `npx prisma migrate deploy`
#     against the DB using DIRECT_URL from Secrets Manager. Migrations are
#     intentionally NOT part of the image build.
#
# Deploys are SHA-pinned: because the ECR repos are IMMUTABLE we push only the
# `:${{ github.sha }}` tag (never re-push `:latest`), then register a fresh
# task-def revision per service that references that exact digest tag and update
# the service to it. This is idempotent across repeated deploys.
#
# All account-specific values are injected via GitHub Actions secrets/vars —
# there are NO real account IDs committed here. Fill these in the repo settings
# (Settings → Secrets and variables → Actions):
#   secrets: AWS_DEPLOY_ROLE_ARN
#            NEXT_PUBLIC_SENTRY_DSN, SENTRY_ORG, SENTRY_PROJECT,
#            SENTRY_AUTH_TOKEN            (all optional; enable Sentry when set)
#   vars:    AWS_REGION, ECR_REGISTRY, ECS_CLUSTER, ECS_WEB_SERVICE,
#            ECS_WORKER_SERVICE, ECS_MIGRATE_TASKDEF, ECS_MIGRATE_SUBNETS,
#            ECS_MIGRATE_SECURITY_GROUPS, NEXT_PUBLIC_APP_URL
#   (ECS_MIGRATE_SUBNETS + ECS_MIGRATE_SECURITY_GROUPS come from the CDK
#    outputs MigrateSubnetIds + MigrateSecurityGroupId.)
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# OIDC: mint short-lived AWS creds, no long-lived access keys.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  WEB_REPO: marketplace-web
  WORKER_REPO: marketplace-worker
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # A red typecheck/test run must block the deploy — a failing build can never
  # ship. Mirrors ci.yml's validation but is a hard `needs` gate for the deploy.
  gate:
    name: Gate · typecheck + test
    runs-on: ubuntu-latest
    env:
      # Placeholder URL just satisfies env validation in src/lib/env.ts.
      DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: gate
    outputs:
      image_tag: ${{ env.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Web image — Dockerfile.web (Next standalone server). Immutable :${sha}
      # tag only; NEXT_PUBLIC_* + Sentry build-args are inlined into the bundle.
      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.WEB_REPO }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

      # Worker image — the existing ./Dockerfile (BullMQ worker). Immutable
      # :${sha} tag only.
      - name: Build & push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.WORKER_REPO }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

  migrate:
    name: DB migrate (release step)
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Register a SHA-pinned migrate revision (base task def with the worker
      # :${sha} image) and run it in-VPC. The migrate SG (CDK output
      # MigrateSecurityGroupId) has egress to Supabase via the NAT gateway;
      # DATABASE_URL/DIRECT_URL come from the Secrets Manager app secret. We
      # wait for the task to stop and assert exit 0.
      - name: Run prisma migrate deploy
        run: |
          set -euo pipefail
          WORKER_IMAGE="${ECR_REGISTRY}/${WORKER_REPO}:${IMAGE_TAG}"
          aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_MIGRATE_TASKDEF }}" \
            --query 'taskDefinition' --output json > base-migrate-td.json
          jq --arg IMG "$WORKER_IMAGE" '
            .containerDefinitions[0].image = $IMG
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)
          ' base-migrate-td.json > migrate-td.json
          MIGRATE_TD=$(aws ecs register-task-definition \
            --cli-input-json file://migrate-td.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered migrate task def: $MIGRATE_TD"
          TASK_ARN=$(aws ecs run-task \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --task-definition "$MIGRATE_TD" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ vars.ECS_MIGRATE_SUBNETS }}],securityGroups=[${{ vars.ECS_MIGRATE_SECURITY_GROUPS }}],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"migrate","command":["npx","prisma","migrate","deploy"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          echo "Started migrate task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "${{ vars.ECS_CLUSTER }}" --tasks "$TASK_ARN"
          EXIT=$(aws ecs describe-tasks --cluster "${{ vars.ECS_CLUSTER }}" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "migrate task exit code: $EXIT"
          test "$EXIT" = "0"

  deploy:
    name: Roll ECS services
    runs-on: ubuntu-latest
    needs: [build-and-push, migrate]
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # For each service: take its current task def, swap the container image to
      # the immutable :${sha} we just pushed, register a new revision, and point
      # the service at it. SHA-pinning means every deploy pulls the exact image
      # (no reliance on a mutable :latest tag, which an IMMUTABLE ECR rejects).
      - name: Register SHA-pinned revisions and update services
        run: |
          set -euo pipefail
          roll() {
            local svc="$1" repo="$2"
            local image="${ECR_REGISTRY}/${repo}:${IMAGE_TAG}"
            local current
            current=$(aws ecs describe-services \
              --cluster "${{ vars.ECS_CLUSTER }}" --services "$svc" \
              --query 'services[0].taskDefinition' --output text)
            echo "$svc current task def: $current"
            aws ecs describe-task-definition --task-definition "$current" \
              --query 'taskDefinition' --output json > "base-$svc-td.json"
            jq --arg IMG "$image" '
              .containerDefinitions[0].image = $IMG
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                    .compatibilities, .registeredAt, .registeredBy)
            ' "base-$svc-td.json" > "$svc-td.json"
            local new
            new=$(aws ecs register-task-definition \
              --cli-input-json "file://$svc-td.json" \
              --query 'taskDefinition.taskDefinitionArn' --output text)
            echo "$svc new task def: $new"
            aws ecs update-service \
              --cluster "${{ vars.ECS_CLUSTER }}" \
              --service "$svc" \
              --task-definition "$new"
          }
          roll "${{ vars.ECS_WEB_SERVICE }}" "$WEB_REPO"
          roll "${{ vars.ECS_WORKER_SERVICE }}" "$WORKER_REPO"

      - name: Wait for services to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_WEB_SERVICE }}" "${{ vars.ECS_WORKER_SERVICE }}"
